name: Build ReSukiSU + SUSFS kernel (AviumUI / LineageOS 5.15.207)

on:
  workflow_dispatch:
    inputs:
      kernel_commit:
        description: "LineageOS/android_kernel_xiaomi_sm8550 commit (the -g<hash> in the ROM's kernel version)"
        default: "b6fba9b3b25b60776cc435a2d01edd5c3646ce4e"
        required: true
      resukisu_ref:
        description: "ReSukiSU branch / tag / commit"
        default: "main"
        required: true
      susfs_ref:
        description: "susfs4ksu branch / tag / commit"
        default: "gki-android13-5.15"
        required: true

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_xiaomi_sm8550.git
  # Same toolchain as the AviumUI build (clang 21, r563880c).
  CLANG_BRANCH: android16-qpr2-release
  CLANG_DIR: clang-r563880c
  SUSFS_PATCH: 50_add_susfs_in_gki-android13-5.15.patch
  # Match the stock AviumUI kernel banner.
  KBUILD_BUILD_USER: ubuntu
  KBUILD_BUILD_HOST: ubuntu
  KBUILD_BUILD_TIMESTAMP: "Fri Aug 7 20:36:15 UTC 2026"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force || true
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          df -h / /mnt && free -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl zip unzip xz-utils zstd bc bison flex cpio rsync kmod \
            libssl-dev libelf-dev python3 dwarves
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Fetch kernel source
        run: |
          git init -q kernel && cd kernel
          git fetch --depth=1 "$KERNEL_REPO" "${{ inputs.kernel_commit }}"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %ci %s'
          head -5 Makefile

      - name: Fetch clang
        run: |
          git clone --depth=1 --filter=blob:none --sparse -b "$CLANG_BRANCH" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          git -C clang sparse-checkout set "$CLANG_DIR"
          echo "$GITHUB_WORKSPACE/clang/$CLANG_DIR/bin" >> "$GITHUB_PATH"
          "clang/$CLANG_DIR/bin/clang" --version | head -1

      - name: Integrate ReSukiSU
        working-directory: kernel
        run: |
          curl -LSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
            | bash -s "${{ inputs.resukisu_ref }}"
          echo "RESUKISU_COMMIT=$(git -C KernelSU rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "RESUKISU_VERSION=$(( 30000 + $(git -C KernelSU rev-list --count HEAD) + 700 ))" >> "$GITHUB_ENV"

      - name: Integrate SUSFS
        working-directory: kernel
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git "$GITHUB_WORKSPACE/susfs"
          git -C "$GITHUB_WORKSPACE/susfs" checkout "${{ inputs.susfs_ref }}"
          echo "SUSFS_COMMIT=$(git -C "$GITHUB_WORKSPACE/susfs" rev-parse --short HEAD)" >> "$GITHUB_ENV"
          cp "$GITHUB_WORKSPACE"/susfs/kernel_patches/fs/* fs/
          cp "$GITHUB_WORKSPACE"/susfs/kernel_patches/include/linux/* include/linux/
          # LineageOS adds <trace/hooks/blk.h> right after "internal.h", which breaks the
          # first fs/namespace.c hunk's context. Move it above the hunk.
          if grep -q '^#include <trace/hooks/blk.h>' fs/namespace.c; then
            sed -i '/^#include <trace\/hooks\/blk.h>/d' fs/namespace.c
            sed -i 's|^#include <linux/fs_context.h>|#include <trace/hooks/blk.h>\n&|' fs/namespace.c
          fi
          patch -p1 --forward --fuzz=3 < "$GITHUB_WORKSPACE/susfs/kernel_patches/$SUSFS_PATCH"
          if find . -name '*.rej' | grep -q .; then
            echo "::error::SUSFS patch left rejected hunks"; find . -name '*.rej' -exec cat {} +; exit 1
          fi
          grep '^#define SUSFS_VERSION' include/linux/susfs.h

      - name: Configure
        working-directory: kernel
        run: |
          cat > "$GITHUB_WORKSPACE/ksu.config" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          # Thin LTO keeps the final link within the runner's memory.
          # CONFIG_LTO_CLANG_FULL is not set
          CONFIG_LTO_CLANG_THIN=y
          EOF
          # Same kernel version string as the stock build, without "-dirty".
          echo "-g$(git rev-parse --short=12 HEAD)" > .scmversion
          MAKE="make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-"
          $MAKE gki_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/kalama_GKI.config \
            arch/arm64/configs/vendor/ishtar_GKI.config \
            "$GITHUB_WORKSPACE/ksu.config"
          $MAKE olddefconfig
          for c in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_TARGET_PRODUCT_ISHTAR CONFIG_LTO_CLANG_THIN; do
            grep -q "^$c=y" out/.config || { echo "::error::$c is not enabled"; exit 1; }
          done

      - name: Build
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc --all)" Image
          BANNER=$(grep -a -o -m1 'Linux version 5\.15[ -~]*' out/arch/arm64/boot/Image)
          echo "$BANNER"
          echo "KERNEL_RELEASE=$(echo "$BANNER" | awk '{print $3}')" >> "$GITHUB_ENV"
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image"

      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="ReSukiSU-${RESUKISU_VERSION}-SUSFS-${KERNEL_RELEASE}-ishtar"
          echo "PKG_NAME=$NAME" >> "$GITHUB_ENV"
          bash scripts/package.sh Image "$NAME"

      - name: Build info
        run: |
          {
            echo "### $PKG_NAME"
            echo "- uname -r: \`$KERNEL_RELEASE\`"
            echo "- Kernel: LineageOS/android_kernel_xiaomi_sm8550 \`${{ inputs.kernel_commit }}\`"
            echo "- Toolchain: $CLANG_DIR ($CLANG_BRANCH)"
            echo "- ReSukiSU: \`$RESUKISU_COMMIT\` (version $RESUKISU_VERSION, ref ${{ inputs.resukisu_ref }})"
            echo "- SUSFS: \`$SUSFS_COMMIT\` (ref ${{ inputs.susfs_ref }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: out/*
          compression-level: 0
